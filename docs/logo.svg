<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#34c759"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Top arrow: left to right -->
  <g fill="white">
    <!-- Shaft -->
    <rect x="112" y="184" width="220" height="44" rx="22"/>
    <!-- Arrowhead -->
    <polygon points="310,144 400,206 310,268"/>
  </g>

  <!-- Bottom arrow: right to left -->
  <g fill="white">
    <!-- Shaft -->
    <rect x="180" y="284" width="220" height="44" rx="22"/>
    <!-- Arrowhead -->
    <polygon points="202,244 112,306 202,368"/>
  </g>
</svg>
